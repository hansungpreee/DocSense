# 실험용: config/taxonomy.yaml(기존 19종 + 기타) + 인사·고객·법무 신규 37종(HR-06~15, CUS-04~15, LEG-04~18) 정의 초안.
# 코드는 백엔드 2 생성기(src/eval/plan75, PR #85)의 가안이다. 정의는 생성기 양식의 제목·구조를 보고 쓴 초안이며,
# 팀 합의 전이라 config/taxonomy.yaml은 바꾸지 않고 run_expansion.py --taxonomy로만 쓴다.
# config/taxonomy.yaml
# PRD 5절/8절 기준 VLM 문서 분류 체계 정의서 (대분류 6종, 소분류 19종 + 기타 1종)

taxonomy:
  - major: "인사/채용"
    items:
      - minor_code: "HR-01"
        minor_name: "이력서"
        definition: "지원자의 성명·연락처·증명사진 등 인적사항과 학력사항, 경력사항, 자격면허 표가 포함된 채용 지원 문서"
      - minor_code: "HR-02"
        minor_name: "근로계약서"
        definition: "사업주와 근로자 간의 근로계약기간, 근무장소, 소정근로시간, 임금(월급·시급), 연차유급휴가를 약정한 고용 계약서"
      - minor_code: "HR-03"
        minor_name: "연봉 실수령액표"
        definition: "연봉에서 4대보험(국민연금·건강보험·장기요양·고용보험)과 소득세·지방소득세를 뺀 월 실수령액을 나열한 급여표. 연봉 구간별 기준표 형태와, 직원별(사번·성명·부서·직급)로 연봉·공제액·월 실수령액을 적은 형태 모두 해당. 국민연금공단에 가입자별 소득총액을 신고하는 서식(FIN-06)과 달리 월 실수령액이 중심"
      - minor_code: "HR-06"
        minor_name: "복지제도 안내서"
        definition: "인사총무팀이 임직원에게 건강검진·경조사비·학자금 등 복지제도를 번호·제도·대상·지원 내용·신청 방법 표로 안내하고 유의 사항과 문의처를 적은 사내 안내문"
      - minor_code: "HR-07"
        minor_name: "인사발령통지서"
        definition: "문서번호와 발령일 아래에 승진·전보·직책 임명 등 발령 대상자의 성명·사번·구분·발령 전·발령 후를 표로 적고 대표이사 직인으로 발령을 알리는 통지서. 재직 사실만 증명하는 재직증명서(HR-04)나 공적을 적어 추천하는 포상 추천서(HR-12)와 달리 발령 전·후 비교가 중심"
      - minor_code: "HR-08"
        minor_name: "위생교육 이수확인서"
        definition: "식품 취급 종사자의 성명·소속·교육과정·교육시간·교육기관을 적고 위생교육 과정을 이수했음을 교육기관장이 확인하는 확인서. 검사 항목·판정 표가 있는 건강진단결과서(HR-09)와 달리 교육과정과 교육시간의 이수 확인이 중심"
      - minor_code: "HR-09"
        minor_name: "건강진단결과서"
        definition: "식품 등 종사자용 건강진단의 인적사항, 검사 항목·검사 방법·결과·판정 표, 종합 판정과 검진일·검진기관을 적은 결과서. 종사자 개인의 인적사항과 판정이 있어 검사 대상이 사람이며, 시료를 검사하는 품질검사 성적서(LEG-06)와 구분"
      - minor_code: "HR-10"
        minor_name: "교대근무표"
        definition: "물류센터 조별 근무자 성명 행과 2주간 날짜·요일 열에 주간(D)·오후(E)·야간(N)·휴무(OFF) 근무 기호를 채운 교대 근무 편성표"
      - minor_code: "HR-11"
        minor_name: "교육훈련 계획표"
        definition: "한 해 동안의 교육과정·대상·시기·시간·교육기관·예산을 번호 붙여 나열한 사내 교육훈련 연간 계획표. 과정별 시기·예산을 나열한 계획이라 이수를 확인하는 위생교육 이수확인서(HR-08)와 달리 확인 문구가 없음"
      - minor_code: "HR-12"
        minor_name: "포상 추천서"
        definition: "포상 대상 직원의 인적사항(사번·소속·직위)과 공적 사항 목록, 추천 사유를 적어 포상을 추천하는 문서. 발령 전·후를 적는 인사발령통지서(HR-07)와 달리 공적 사항과 추천 사유가 중심"
      - minor_code: "HR-13"
        minor_name: "자격증 취득 현황표"
        definition: "임직원별 성명·사번·소속과 자격증명·취득일·발급기관·월 자격수당을 기준일 기준으로 나열한 현황표. 임직원의 자격증 취득 정보를 나열한 표로, 거래처 담당자를 나열한 연락처 명부(SAL-15)와 구분"
      - minor_code: "HR-14"
        minor_name: "면접평가표"
        definition: "지원번호·지원자·지원 직무·면접위원을 적고 직무 지식·의사소통 등 평가 항목을 5단계 평점으로 매긴 뒤 총점과 합격·보류·불합격 판정, 종합 의견을 적은 채용 면접 평가 서식. 평가 대상이 지원자이며, 거래처를 평가하고 신용 등급(A~D)을 내는 거래처 신용평가표(CUS-05)와 구분"
      - minor_code: "HR-15"
        minor_name: "직무기술서"
        definition: "직무명·소속·직급과 직무 목적, 주요 업무별 세부 내용과 비중(%), 자격 요건, 필요 역량, 근무 조건을 정리한 문서. 업무 처리 절차를 단계별로 적는 업무 처리 매뉴얼(MGT-07)과 달리 직무의 목적·자격 요건·필요 역량을 설명"

  - major: "재무/회계"
    items:
      - minor_code: "FIN-01"
        minor_name: "합계잔액시산표"
        definition: "표 중앙의 '계정과목' 열을 기준으로 좌측에 '차변(잔액·합계)', 우측에 '대변(합계·잔액)'이 대칭 구조로 배치된 재무 검증 표"
      - minor_code: "FIN-02"
        minor_name: "원가명세서"
        definition: "제조 과정의 I.재료비, II.노무비, III.경비를 더한 당기총제조비용에 기초·기말재공품원가를 가감하여 '당기제품제조원가'를 산출하는 명세서"
      - minor_code: "FIN-03"
        minor_name: "손익계산서"
        definition: "일정 기간의 I.매출액, II.매출원가, III.매출총이익, IV.판매비와관리비, V.영업손익, VI.영업외수익, VII.영업외비용, VIII.당기순손익이 위에서 아래로 나열된 경영성과 재무제표"
      - minor_code: "FIN-04"
        minor_name: "총수입금액 및 필요경비명세서"
        definition: "사업자의 총수입금액과 매출원가, 일반관리비 등 필요경비 산출 내역을 집계하여 세무서에 제출하는 법정 서식"
      - minor_code: "FIN-05"
        minor_name: "주요경비지출명세서"
        definition: "주요경비 지출 내역을 거래처(공급자)별 상호(성명), 사업자등록번호(주민등록번호), 매수, 거래품목, 거래금액으로 일련번호를 붙여 기재하는 세무 명세서"
      - minor_code: "FIN-06"
        minor_name: "소득총액신고서"
        definition: "국민연금공단에 사업장 가입자(근로자)별 신고유형, 취득일자, 실제 근무시작일, 휴직일수와 전년도 소득총액을 신고하는 다인 명부 형태의 서식"
      - minor_code: "FIN-07"
        minor_name: "사업소득 원천징수영수증"
        definition: "징수의무자와 소득자 인적사항, 지급총액, 세율(3%), 원천징수세액(소득세·지방소득세)이 표로 기재된 영수증 및 지급명세서"
      - minor_code: "FIN-08"
        minor_name: "소득·세액 공제신고서"
        definition: "연말정산을 위해 근로소득자 또는 종교인이 부양가족 인적공제 명세와 연금·보험료·의료비·신용카드 등 공제 금액을 직접 기입하는 신고서"
      - minor_code: "FIN-09"
        minor_name: "감사보고서"
        definition: "회사 내부감사팀이 이사회 등에 보고하는 감사 보고서. 감사기간·감사목적·감사구분·피감사부·감사원, 감사결과 및 주요 발견 사항, 개선 권고 사항, 결론이 서술형과 표로 작성됨. 결산·매출채권뿐 아니라 재고실사·가맹점 로열티·문서보안 등 감사 대상과 관계없이 해당하며, 외부 감사인의 감사보고서도 여기에 해당"

  - major: "경영/전략"
    items:
      - minor_code: "MGT-01"
        minor_name: "거래처 매입매출현황 분석표"
        definition: "주요 거래처별 매입 금액·비율, 매출 금액·비율, 순이익 금액·기여도와 각각의 전년대비 증감률을 비교 분석한 경영 현황 보고서"

  - major: "영업/제안"
    items:
      - minor_code: "SAL-01"
        minor_name: "견적서"
        definition: "공급자와 수신처 정보, 합계금액, 품목별 규격·수량·단가·공급가액·세액 내역 표가 포함된 표준 견적서 및 견적서·거래명세표 통합 문서"
      - minor_code: "SAL-02"
        minor_name: "거래처 방문일지"
        definition: "영업 담당자의 방문일자, 방문시간, 거래처 정보, 방문목적 및 요구사항, 상담 결과 및 향후 계획이 기록된 영업 일지"

  - major: "고객/거래처"
    items:
      - minor_code: "CUS-01"
        minor_name: "비밀유지계약서"
        definition: "원사업자와 수급사업자 간 제공하는 기술자료의 명칭·범위, 제공받는 목적, 사용기간·반환(폐기)일 및 보유 임직원 명단이 포함된 계약서(NDA)"
      - minor_code: "CUS-02"
        minor_name: "가맹계약서"
        definition: "가맹본부와 가맹점사업자 간 영업표지(브랜드) 사용, 최초가맹금·계속가맹금(로열티), 영업지역 보호, 교육훈련 조건을 약정한 프랜차이즈 계약서"
      - minor_code: "CUS-04"
        minor_name: "거래처 등록신청서"
        definition: "결재란 아래 신청일·신청 부서와 신규 거래처의 상호·사업자등록번호·대표자·업태 등 정보를 적고 첨부 서류(사업자등록증 사본 등) 체크란이 있는 거래처 등록 신청 서식. 세무서가 발급한 사업자등록증(CUS-11)과 달리 사내 결재란이 있는 신청 서식"
      - minor_code: "CUS-05"
        minor_name: "거래처 신용평가표"
        definition: "거래처 정보 아래 평가 항목별 배점·득점 표와 합계, A~D 신용 등급과 평가 의견을 적은 거래처 신용 평가 서식. 평가 대상이 거래처이고 거래처별 득점이 있어, 등급별 기준과 혜택만 정리한 거래처 등급 기준표(SAL-11)나 지원자를 평가하는 면접평가표(HR-14)와 구분"
      - minor_code: "CUS-06"
        minor_name: "클레임 처리 보고서"
        definition: "접수번호·접수일·거래처 등 접수 정보와 클레임 내용, 원인 분석, 조치 내용, 재발 방지 대책, 처리 결과를 적은 고객 클레임 처리 보고서. 거래처의 클레임을 처리하는 문서로, 재해자·부상 부위를 적는 산업재해 발생 보고서(LEG-04)와 달리 접수번호·거래처와 처리 결과가 중심"
      - minor_code: "CUS-07"
        minor_name: "거래처 계약 갱신 통지서"
        definition: "거래처 대표이사를 수신으로 하는 공문 형식으로 기존 거래 계약 만료를 알리고 계약 기간·결제 조건 등 현행과 갱신 후 조건을 표로 비교해 회신을 요청하는 통지서. 서술형 본문이 중심인 우편 문서(LEG-12)와 달리 현행·갱신 조건 비교표가 있음"
      - minor_code: "CUS-08"
        minor_name: "거래처 월간 소식지"
        definition: "거래처에 보내는 ○월호 소식지로 이달의 신제품, 이달의 프로모션 기간·내용, 물류 공지와 문의처를 실은 뉴스레터. 달력 칸에 일정을 표시하는 거래처 월간 행사 캘린더(CUS-15)와 달리 신제품·프로모션·공지를 글로 싣는 뉴스레터"
      - minor_code: "CUS-09"
        minor_name: "거래처 출입 허가증"
        definition: "허가번호와 방문 회사·방문자·차량번호·방문 목적·면담 담당·허가 일시를 적고 출입 허용 구역 체크와 안전 수칙, 신청·면담자·보안담당 서명란이 있는 방문자 출입 허가증. 차량에 붙이는 사내 주차 허가증(LEG-16)과 달리 방문자의 출입 허용 구역과 안전 수칙이 있음"
      - minor_code: "CUS-10"
        minor_name: "거래처 대표자 인감증명서"
        definition: "발급번호와 성명·생년월일·주소·용도를 적고 인영(인감 도장) 칸과 '위 인감이 신고되어 있음을 증명합니다' 문구, 구청장 직인이 있는 인감증명서"
      - minor_code: "CUS-11"
        minor_name: "사업자등록증"
        definition: "세무서가 발급한 법인사업자 사업자등록증으로 등록번호와 법인명·대표자·개업 연월일·법인등록번호·사업장 소재지·사업의 종류(업태·종목)와 발급일·세무서장 직인이 적힌 증명서. 사내에서 쓰는 신청 서식인 거래처 등록신청서(CUS-04)와 달리 세무서가 발급한 증명서"
      - minor_code: "CUS-12"
        minor_name: "거래처 위치 약도"
        definition: "거래처 이름의 위치 약도로 도로·건물·목적지를 그린 지도 그림과 주소·전화·담당자, 대중교통·주차 등 오시는 길 안내를 적은 문서. 지역별 담당자 배치를 나타내는 지역별 영업 담당 구역도(SAL-20)와 달리 한 거래처의 찾아오는 길을 안내"
      - minor_code: "CUS-13"
        minor_name: "거래처 위촉장"
        definition: "겹테두리 안에 호수, 거래처명과 대표 성명, 자문위원 등 위촉 직함과 위촉 기간을 적고 대표이사 직인을 찍어 위촉을 알리는 증서. 감사 문구가 중심인 거래처 감사장(CUS-14)과 달리 직함과 기간이 있음"
      - minor_code: "CUS-14"
        minor_name: "거래처 감사장"
        definition: "장식 테두리 안에 거래처명과 거래 연차, 신뢰와 협력에 감사하는 문구를 적고 대표이사 직인을 찍은 증서. 위촉 직함·위촉 기간이 있는 거래처 위촉장(CUS-13)과 달리 감사 문구가 중심"
      - minor_code: "CUS-15"
        minor_name: "거래처 월간 행사 캘린더"
        definition: "한 달 달력 칸에 정기 배송·프로모션·시식 행사·물류센터 휴무·가격 개정 일정을 색으로 표시하고 범례를 단 거래처용 행사 일정 달력. 글 기사 중심의 거래처 월간 소식지(CUS-08)와 달리 달력 칸에 일정을 색으로 표시"

  - major: "법무/총무"
    items:
      - minor_code: "LEG-01"
        minor_name: "상가건물 임대차계약서"
        definition: "큰 제목이 '상가건물 임대차 표준계약서'인 임대차 계약서. 오른쪽 위 머리글에 '상가건물 임대차 표준계약서 (2024. 5. 8 개정)'이 적혀 있음. 본문 서식은 LEG-02와 같음"
      - minor_code: "LEG-02"
        minor_name: "표준임대차계약서"
        definition: "큰 제목이 '표준임대차계약서'인 임대차 계약서. 오른쪽 위 머리글에 '표준임대차계약서'가 적혀 있음. 본문 서식은 LEG-01과 같음"
      - minor_code: "LEG-04"
        minor_name: "산업재해 발생 보고서"
        definition: "결재란 아래 발생 일시·장소·재해자·재해 유형·부상 부위·치료 정도와 발생 경위, 원인, 조치 사항, 재발 방지 대책을 적은 사업장 산업재해 보고서. 거래처 클레임을 처리하는 클레임 처리 보고서(CUS-06)와 달리 재해자·재해 유형·부상 부위가 중심"
      - minor_code: "LEG-05"
        minor_name: "HACCP 인증서"
        definition: "식품 보관·유통 업소의 업소명·대표자·소재지·인증 품목·인증번호·유효기간을 적고 인증 기관장이 위해요소중점관리기준(HACCP) 적용 업소임을 인증하는 증서. 교육 이수를 확인하는 위생교육 이수확인서(HR-08)나 시험 결과 표인 품질검사 성적서(LEG-06)와 달리 인증 기관장이 업소를 인증"
      - minor_code: "LEG-06"
        minor_name: "품질검사 성적서"
        definition: "성적서 번호와 의뢰인·시료명·접수일·검사일을 적고 검사 항목·기준·결과·판정 표와 종합 판정을 적은 시험·검사 성적서. 검사 대상이 시료(제품)이며, 사람의 건강진단 결과를 적는 건강진단결과서(HR-09)와 구분"
      - minor_code: "LEG-07"
        minor_name: "원산지 증명서"
        definition: "CERTIFICATE OF ORIGIN 부제와 수출자·수입자·운송 정보, 품명·HS 코드·수량·중량·원산지 품목 표, 발급 기관 확인이 있는 원산지 증명서. 원산지가 중심이며, 신고 수리를 확인하는 수입식품 신고필증(LEG-08)과 구분"
      - minor_code: "LEG-08"
        minor_name: "수입식품 신고필증"
        definition: "신고번호와 신고일·수리일·영업자·제품명·수출국·중량 등 수입식품 신고 사항을 적고 신고가 수리되었음을 확인하는 수입식품등 수입신고 확인증. 원산지를 증명하는 원산지 증명서(LEG-07)와 달리 신고가 수리되었음을 확인"
      - minor_code: "LEG-09"
        minor_name: "차량운행일지"
        definition: "차량번호·차종·운전자를 적고 일자별 출발지·도착지·출발 km·도착 km·거리·목적을 기록한 운행 표와 주유 기록이 있는 업무 차량 일지"
      - minor_code: "LEG-10"
        minor_name: "비상 대피 안내도"
        definition: "층별 평면도 그림에 현재 위치·대피 경로·비상구·소화기 위치를 표시하고 화재 발생 시 행동 요령을 적은 대피 안내도. 상품 진열 배치를 그린 진열 계획도(SAL-12)와 달리 대피 경로와 비상구가 중심"
      - minor_code: "LEG-11"
        minor_name: "위임장"
        definition: "위임인(회사 상호·대표자·사업자번호)과 수임인(성명·소속)의 정보, 위임 사항과 위임 기간을 적고 위임인이 날인하는 위임장"
      - minor_code: "LEG-12"
        minor_name: "내용증명"
        definition: "큰 제목 '내용증명'과 수신인·발신인 주소, 제목 아래 번호 매긴 본문으로 대금 지급·계약 이행 등을 요구하거나 통지하는 우편 문서. 현행·갱신 조건 비교표로 계약 갱신을 알리는 거래처 계약 갱신 통지서(CUS-07)와 달리 서술형 본문이 중심"
      - minor_code: "LEG-13"
        minor_name: "사내 공고문"
        definition: "색 띠의 '공고' 머리와 공고 번호·게시 기간, 휴무·소방 훈련·시스템 점검 등 안내 제목, 일시·대상·내용을 적고 인사총무팀 명의로 게시하는 사내 공지문. 특정 직원 개인을 대상으로 한 인사발령통지서(HR-07)와 달리 전 직원에게 안내"
      - minor_code: "LEG-14"
        minor_name: "개인정보 수집·이용 동의서"
        definition: "수집·이용 목적, 수집 항목, 보유·이용 기간, 제3자 제공 여부 표와 동의·미동의 체크, 성명·서명란이 있는 개인정보 동의 서식"
      - minor_code: "LEG-15"
        minor_name: "문서수발대장"
        definition: "결재란 아래 번호·일자·수신/발신 구분·문서번호·문서 제목·상대 기관·담당자·확인 열로 주고받은 문서를 기록한 대장. 어음 한 건을 한 줄에 적는 어음관리대장(FIN-20)과 달리 주고받은 문서를 한 줄씩 기록"
      - minor_code: "LEG-16"
        minor_name: "주차 허가증"
        definition: "'주차 허가증' 머리 아래 큰 차량번호와 허가번호·성명·소속·차종·주차 구역·유효 기간을 적고 차량 부착 안내가 있는 사내 주차 허가증. 방문자의 출입 허용 구역이 있는 거래처 출입 허가증(CUS-09)과 달리 차량번호와 주차 구역이 중심"
      - minor_code: "LEG-17"
        minor_name: "법인 등기사항증명서"
        definition: "고유번호와 상호·본점·공고 방법·1주의 금액·발행주식 등 등기 사항, 목적 목록, 임원에 관한 사항 표가 있는 법인 등기사항전부증명서. 주주별 지분 목록인 주주명부(FIN-17)와 달리 상호·본점·목적·임원 등 등기 사항이 중심"
      - minor_code: "LEG-18"
        minor_name: "법률 자문 의견서"
        definition: "의뢰인·작성일·주제·관련 부서를 적고 사안 개요, 질의, 의견, 결론 순으로 서술한 법률 검토 의견서"

  - major: "기타"
    items:
      - minor_code: "ETC-00"
        minor_name: "분류불가 (신규 분류 제안)"
        definition: "분류 체계의 소분류에 해당하지 않는 사외 양식이나 미등록 문서로 신규 분류 제안(NEW-xx)이 필요한 문서"
