# config/taxonomy.yaml
# PRD 5절/8절 기준 VLM 문서 분류 체계 정의서 (대분류 6종, 소분류 100종 + 기타 1종)
# 분류 원칙 (ISO 15489-1:2016 8.3절 업무분류체계, ISO/TR 26122 업무과정 분석 참고. 대분류 기능과 경계 규칙: docs/taxonomy_principles.md)
# 1. 대분류는 HS리테일의 업무 기능이다. "이 문서는 어느 업무를 하려고 만들었나"로 정한다.
# 2. 소분류는 그 기능에서 생기는 문서 유형(양식)이다. 제목·표 구성 등 보이는 특징으로 구분한다.
# 3. 문서 형식(계약서·신고서·보고서)만으로 대분류를 정하지 않는다.
# 4. 한 문서 유형은 한 기능에만 둔다. 두 기능에 걸치면 경계 규칙을 따른다.
# 5. 소분류 코드는 식별자다. 대분류를 옮겨도 코드를 다시 발급하지 않는다(라벨·파일명·과거 결과 비교 유지).
# 6. 소분류 정의(definition)에는 보이는 특징만 쓴다. 기능 설명은 이 주석과 문서에 둔다.
# 7. 소분류를 더하거나 옮길 때 확인: 어느 기능인가, 기존 소분류와 보이는 특징으로 구분되는가, 개발셋 혼동은 없는가. 체계 밖 문서는 「기타」로 분류한다.

taxonomy:
  - major: "인사/채용"
    items:
      - minor_code: "HR-01"
        minor_name: "이력서"
        definition: "채용에 지원하는 사람이 자신의 인적사항(성명·연락처·증명사진), 학력, 경력, 자격·면허를 적어 회사에 내는 지원 서류. 기본형·상세형 양식 모두 해당"
      - minor_code: "HR-02"
        minor_name: "근로계약서"
        definition: "회사(사업주)와 근로자가 근로계약기간, 근무장소, 소정근로시간, 임금(월급·시급), 연차유급휴가 등 근로조건을 정해 맺는 고용 계약서"
      - minor_code: "HR-03"
        minor_name: "연봉 실수령액표"
        definition: "연봉에서 4대보험(국민연금·건강보험·장기요양·고용보험)과 소득세·지방소득세를 뺀 월 실수령액을 정리한 급여 안내표. 직원별(사번·성명·부서·직급) 표와 연봉 구간별 기준표 모두 해당. 한 사람의 특정 월 지급 항목과 공제 항목을 적은 개인별 급여 내역서는 해당하지 않음. 국민연금공단에 소득총액을 신고하는 FIN-06과 달리 직원이 받는 월 실수령액이 중심"
      - minor_code: "HR-04"
        minor_name: "재직증명서"
        definition: "회사가 소속 직원의 재직 사실(성명·소속·직위·입사일·재직기간)을 확인해 주는 증명서. 용도와 제출처, 발급일, 회사 직인이 있음. 재직증명서와 경력증명서를 함께 쓴 양식도 해당. 근로조건을 정하는 근로계약서(HR-02)와 달리 재직 사실을 증명하기만 함"
      - minor_code: "HR-06"
        minor_name: "복지제도 안내서"
        definition: "인사총무팀이 임직원에게 건강검진·경조사비·학자금 등 복지제도를 번호·제도·대상·지원 내용·신청 방법 표로 안내하고 유의 사항과 문의처를 적은 사내 안내문"
      - minor_code: "HR-07"
        minor_name: "인사발령통지서"
        definition: "문서번호와 발령일 아래에 승진·전보·직책 임명 등 발령 대상자의 성명·사번·구분·발령 전·발령 후를 표로 적고 대표이사 직인으로 발령을 알리는 통지서. 재직 사실만 증명하는 재직증명서(HR-04)나 공적을 적어 추천하는 포상 추천서(HR-12)와 달리 발령 전·후 비교가 중심"
      - minor_code: "HR-08"
        minor_name: "위생교육 이수확인서"
        definition: "식품 취급 종사자의 성명·소속·교육과정·교육시간·교육기관을 적고 위생교육 과정을 이수했음을 교육기관장이 확인하는 확인서. 검사 항목·판정 표가 있는 건강진단결과서(HR-09)와 달리 교육과정과 교육시간의 이수 확인이 중심"
      - minor_code: "HR-09"
        minor_name: "건강진단결과서"
        definition: "식품 등 종사자용 건강진단의 인적사항, 검사 항목·검사 방법·결과·판정 표, 종합 판정과 검진일·검진기관을 적은 결과서. 종사자 개인의 인적사항과 판정이 있어 검사 대상이 사람이며, 시료를 검사하는 품질검사 성적서(LEG-06)와 구분"
      - minor_code: "HR-10"
        minor_name: "교대근무표"
        definition: "물류센터 조별 근무자 성명 행과 2주간 날짜·요일 열에 주간(D)·오후(E)·야간(N)·휴무(OFF) 근무 기호를 채운 교대 근무 편성표"
      - minor_code: "HR-11"
        minor_name: "교육훈련 계획표"
        definition: "한 해 동안의 교육과정·대상·시기·시간·교육기관·예산을 번호 붙여 나열한 사내 교육훈련 연간 계획표. 과정별 시기·예산을 나열한 계획이라 이수를 확인하는 위생교육 이수확인서(HR-08)와 달리 확인 문구가 없음"
      - minor_code: "HR-12"
        minor_name: "포상 추천서"
        definition: "포상 대상 직원의 인적사항(사번·소속·직위)과 공적 사항 목록, 추천 사유를 적어 포상을 추천하는 문서. 발령 전·후를 적는 인사발령통지서(HR-07)와 달리 공적 사항과 추천 사유가 중심"
      - minor_code: "HR-13"
        minor_name: "자격증 취득 현황표"
        definition: "임직원별 성명·사번·소속과 자격증명·취득일·발급기관·월 자격수당을 기준일 기준으로 나열한 현황표. 임직원의 자격증 취득 정보를 나열한 표로, 거래처 담당자를 나열한 연락처 명부(SAL-15)와 구분"
      - minor_code: "HR-14"
        minor_name: "면접평가표"
        definition: "지원번호·지원자·지원 직무·면접위원을 적고 직무 지식·의사소통 등 평가 항목을 5단계 평점으로 매긴 뒤 총점과 합격·보류·불합격 판정, 종합 의견을 적은 채용 면접 평가 서식. 평가 대상이 지원자이며, 거래처를 평가하고 신용 등급(A~D)을 내는 거래처 신용평가표(CUS-05)와 구분"
      - minor_code: "HR-15"
        minor_name: "직무기술서"
        definition: "직무명·소속·직급과 직무 목적, 주요 업무별 세부 내용과 비중(%), 자격 요건, 필요 역량, 근무 조건을 정리한 문서. 업무 처리 절차를 단계별로 적는 업무 처리 매뉴얼(MGT-07)과 달리 직무의 목적·자격 요건·필요 역량을 설명"

  - major: "재무/회계"
    items:
      - minor_code: "FIN-01"
        minor_name: "합계잔액시산표"
        definition: "계정과목별 차변·대변의 합계와 잔액을 한 표에 모아 차변과 대변이 일치하는지 검증하는 재무 표. 계정과목 열을 가운데 두고 좌측에 차변, 우측에 대변이 대칭으로 놓임"
      - minor_code: "FIN-02"
        minor_name: "원가명세서"
        definition: "제조 과정에서 일정 기간 든 재료비·노무비·경비를 더해 당기총제조비용을 구하고 기초·기말재공품원가를 가감해 당기제품제조원가를 산출하는 명세서(I.재료비, II.노무비, III.경비 순)"
      - minor_code: "FIN-03"
        minor_name: "손익계산서"
        definition: "일정 기간의 매출액에서 매출원가와 판매비와관리비 등을 차감해 영업손익과 당기순손익까지 경영성과를 보여 주는 재무제표. I.매출액부터 VIII.당기순손익까지 위에서 아래로 이어짐"
      - minor_code: "FIN-04"
        minor_name: "총수입금액 및 필요경비명세서"
        definition: "사업자의 총수입금액과 매출원가, 일반관리비 등 필요경비 산출 내역을 집계해 소득 계산의 근거로 세무서에 제출하는 법정 서식"
      - minor_code: "FIN-05"
        minor_name: "주요경비지출명세서"
        definition: "사업자가 지출한 주요경비를 거래처(공급자)별로 상호(성명), 사업자등록번호(주민등록번호), 매수, 거래품목, 거래금액을 일련번호 순으로 적어 신고하는 세무 명세서. 수입과 필요경비를 집계하는 FIN-04와 달리 거래처별 지출 건 목록이 중심. 거래처별 지출 내역을 표 대신 문장으로 풀어 쓴 서술형도 해당"
      - minor_code: "FIN-06"
        minor_name: "소득총액신고서"
        definition: "회사가 국민연금공단에 사업장 가입자(근로자) 여러 명의 신고유형, 취득일자, 실제 근무시작일, 휴직일수와 전년도 소득총액을 한꺼번에 신고하는 근로자 명부 형태의 서식. 직원이 받는 월 실수령액 안내표(HR-03)와 구분. 신고 내역을 문장으로 풀어 쓴 서술형도 해당"
      - minor_code: "FIN-07"
        minor_name: "사업소득 원천징수영수증"
        definition: "사업소득을 지급하며 세금을 떼는 징수의무자가 소득자에게 지급총액, 세율(3%), 원천징수세액(소득세·지방소득세)을 적어 주는 영수증 및 지급명세서. 징수의무자와 소득자 인적사항이 함께 기재됨. 인적공제·종합소득공제·산출세액이 함께 적혀 있어도 지급월별 지급액과 원천징수세액이 있으면 해당"
      - minor_code: "FIN-08"
        minor_name: "소득·세액 공제신고서"
        definition: "근로소득자 또는 종교인이 연말정산을 위해 부양가족 인적공제 명세와 연금·보험료·의료비·신용카드 등 공제 금액을 직접 적어 회사에 내는 신고서. 근로소득자·종교인이 아닌 사업소득자의 지급액·원천징수세액(3%) 문서는 FIN-07과 구분"
      - minor_code: "FIN-09"
        minor_name: "감사보고서"
        definition: "회사 내부감사팀이 이사회 등에 보고하는 감사 보고서. 감사기간·감사목적·감사구분·피감사부·감사원, 감사결과 및 주요 발견 사항, 개선 권고 사항, 결론이 서술형과 표로 작성됨. 결산·매출채권뿐 아니라 재고실사·가맹점 로열티·문서보안 등 감사 대상과 관계없이 해당하며, 외부 감사인의 감사보고서도 여기에 해당"
      - minor_code: "FIN-10"
        minor_name: "세금계산서"
        definition: "공급자가 공급받는자에게 재화나 용역을 공급하고 발행하는 세금계산서. 공급자와 공급받는자의 사업자등록번호, 작성일, 품목별 공급가액·세액, 합계금액이 기재됨. 전자세금계산서와 종이 세금계산서 모두 해당. 거래 전에 가격을 제시하는 견적서(SAL-01)와 달리 이미 이루어진 거래를 증빙하는 문서. 견적일·유효기간이 적힌 문서는 SAL-01과 구분"
      - minor_code: "FIN-11"
        minor_name: "외상매출금 연령분석표"
        definition: "거래처별 외상매출금 잔액을 30일 이내·31~60일·61~90일·91일 이상 경과 기간으로 나누어 집계하고 합계를 낸 채권 연령 분석표. 거래처별 매입·매출 실적을 분석하는 거래처 매입매출현황 분석표(MGT-01)와 달리 미수 잔액의 경과 기간 구간이 열로 나뉨"
      - minor_code: "FIN-12"
        minor_name: "환율 변동 손익표"
        definition: "외화 거래(USD·EUR·JPY·CNY)별 외화금액, 거래일 환율과 기말(결제일) 환율, 원화 장부금액과 평가금액의 차이로 외환차손익·외화환산손익을 계산한 표"
      - minor_code: "FIN-13"
        minor_name: "판매장려금(리베이트) 정산서"
        definition: "거래처의 정산 기간 매출액에 매출 구간별 또는 품목군별 목표 달성에 따른 장려금 요율을 적용해 판매장려금 금액, 지급 예정일, 입금 계좌를 정리한 정산 문서. 상품 단가 표가 중심인 견적서(SAL-01)와 달리 정산 기간 매출에 요율을 적용한 장려금 계산이 중심"
      - minor_code: "FIN-14"
        minor_name: "입금확인증"
        definition: "입금자, 입금일시, 입금 금액(한글 금액 포함), 입금 계좌, 거래번호가 적히고 입금 사실을 확인한다는 문구와 발급 기관의 직인이 있는 짧은 확인서. 요율 계산이 있는 판매장려금 정산서(FIN-13)와 달리 입금 사실만 확인"
      - minor_code: "FIN-15"
        minor_name: "대출금 상환계획표"
        definition: "대출처·대출원금·금리·기간·상환방식과 함께 회차(또는 연차)별 납입일, 원금, 이자, 납입액, 잔액을 나열한 상환 일정표. 회차별 원금·이자·잔액이 이어지는 일정표로, 자산별 상각 계산을 나열한 고정자산 감가상각 명세서(FIN-18)와 구분"
      - minor_code: "FIN-16"
        minor_name: "이행보증보험증권"
        definition: "보증보험회사가 보험계약자와 피보험자, 증권번호, 보험가입금액, 보험기간, 보증 대상 계약을 기재하고 약관 요약과 직인이 있는 계약이행보증 증권. 계약 당사자가 맺는 계약서(CUS-01·02)가 아니라 보증보험회사가 발행하는 증권"
      - minor_code: "FIN-17"
        minor_name: "주주명부"
        definition: "주주별 성명(상호), 등록번호, 소유 주식수, 지분율, 주식 종류와 발행주식 총수를 적은 명부. 대표이사 확인란이 있음. 주주별 지분 목록이 중심이며, 상호·본점·임원 등 등기 사항 표가 있는 법인 등기사항증명서(LEG-17)와 구분"
      - minor_code: "FIN-18"
        minor_name: "고정자산 감가상각 명세서"
        definition: "건물·기계장치·차량운반구·비품 등 고정자산별 취득가액, 내용연수, 전기말 상각누계액, 당기 상각비, 장부가액을 정액법으로 나열한 명세서"
      - minor_code: "FIN-19"
        minor_name: "현금출납부"
        definition: "일자별 적요와 입금·출금·잔액 열이 있고 전일 이월과 합계가 있는 현금 장부. 거래가 시간 순으로 이어지며 잔액이 계속 갱신됨. 계정과목별 차변·대변 잔액을 모은 합계잔액시산표(FIN-01)와 달리 날짜 순으로 입금·출금과 잔액이 이어짐"
      - minor_code: "FIN-20"
        minor_name: "어음관리대장"
        definition: "어음번호, 받을어음·지급어음 구분, 거래처, 발행일, 만기일, 금액, 지급은행, 보관·추심·결제 상태를 한 줄씩 기록한 어음 장부. 일자별 입출금이 이어지는 현금출납부(FIN-19)와 달리 어음 한 건이 한 줄"
      - minor_code: "FIN-21"
        minor_name: "퇴직연금 가입 내역서"
        definition: "금융회사(은행·증권·보험)가 발급한 확정기여형(DC)·확정급여형(DB)·IRP 퇴직연금의 가입자 또는 가입자별 부담금·적립금, 운용 상품별 평가금액·비중·수익률을 정리한 내역서"
      - minor_code: "FIN-22"
        minor_name: "정부 보조금 교부 결정 통지서"
        definition: "정부·공공기관이 사업명, 교부결정액, 사업기간, 교부 방법과 조건(용도 제한, 정산 보고 등)을 기업에 통지하는 공문 또는 결정서. 기관장 직인이 있음. 거래처에 보내는 계약 갱신 통지서(CUS-07)나 우편 문서인 내용증명(LEG-12)이 아니라 정부·공공기관이 기업에 보조금 결정을 통지"

  - major: "경영/전략"
    items:
      - minor_code: "MGT-01"
        minor_name: "거래처 매입매출현황 분석표"
        definition: "주요 거래처별 매입·매출·순이익 금액과 비율(기여도), 각각의 전년대비 증감률을 비교해 거래처별 거래 성과를 분석한 경영 현황 보고서"
      - minor_code: "MGT-02"
        minor_name: "연간사업계획서"
        definition: "부서(본부)가 다음 연도의 목표 매출·영업이익, 월별 매출 계획, 중점 추진 과제(담당·기한·예산)를 정리한 사업 계획 문서. 과거 거래 실적을 분석하는 거래처 매입매출현황 분석표(MGT-01)와 달리 앞으로의 목표와 실행 계획이 중심"
      - minor_code: "MGT-03"
        minor_name: "SWOT 분석서"
        definition: "분석 대상 사업의 강점(S)·약점(W)·기회(O)·위협(T)을 나누어 항목별로 나열한 분석 문서. 2×2 칸 또는 표로 배치되고 SO·WO·ST·WT 전략이 이어질 수 있음"
      - minor_code: "MGT-04"
        minor_name: "신제품 출시 계획서"
        definition: "신제품 하나의 이름·규격·소비자가·목표 고객, 개발부터 출시까지의 단계별 일정, 판매 목표와 마케팅 예산을 담은 사내 계획서. 시장 전체 조사(MGT-05)나 물류센터 투자 검토(MGT-08)가 아니라 제품 하나의 출시 일정이 중심"
      - minor_code: "MGT-05"
        minor_name: "시장조사보고서"
        definition: "특정 제품 시장의 규모 추이 그래프, 업체별 점유율, 소비자 설문(구매 요인 등) 결과와 시사점을 정리한 조사 보고서. 경쟁 제품을 항목별로 맞비교하는 표(SAL-18)와 달리 시장 전반의 수치가 중심"
      - minor_code: "MGT-06"
        minor_name: "프로젝트 일정표(간트차트)"
        definition: "업무 항목과 담당자를 세로로, 주차(또는 월)를 가로로 두고 일정 구간을 막대로 채운 간트 차트와 마일스톤"
      - minor_code: "MGT-07"
        minor_name: "업무 처리 매뉴얼"
        definition: "특정 업무(거래처 등록, 반품, 입고 검수 등)의 목적·적용 범위와 단계별 담당자·처리 내용·소요 기간(또는 업무 흐름도), 유의사항, 개정 이력을 적은 표준 절차서. 직무의 자격·역량을 설명하는 직무기술서(HR-15)와 달리 처리 단계가 중심"
      - minor_code: "MGT-08"
        minor_name: "신규 물류센터 사업타당성 검토서"
        definition: "신규 물류센터 후보지 비교, 총 투자비 구성, NPV·IRR·투자 회수 기간 같은 수익성 지표나 시나리오별(낙관·기준·비관) 분석과 결론을 담은 투자 검토 문서. 제품 하나의 출시 일정이 중심인 신제품 출시 계획서(MGT-04)와 달리 투자비와 수익성 지표가 중심"
      - minor_code: "MGT-09"
        minor_name: "사업장 현황표"
        definition: "본사·물류센터·지점·영업소 등 사업장별 소재지, 면적, 임차·자가 구분, 인원, 기능, 개설일을 나열한 현황표. 건물 임대차 조건을 정하는 계약서(LEG-01·02)가 아니라 사업장별 현황을 나열"
      - minor_code: "MGT-10"
        minor_name: "ESG 경영 보고서"
        definition: "환경(온실가스·에너지·폐기물), 사회(임직원·안전·교육), 지배구조(이사회·윤리) 영역별 지표를 연도별 표나 지표 카드로 보여 주는 지속가능경영 보고서"
      - minor_code: "MGT-11"
        minor_name: "리스크 관리 대장"
        definition: "리스크 번호, 리스크명, 분류, 발생 가능성·영향도 점수와 등급, 대응방안, 담당자, 상태를 기록한 대장. 5×5 위험 매트릭스가 함께 있을 수 있음"
      - minor_code: "MGT-12"
        minor_name: "조직도"
        definition: "대표이사 아래 본부와 팀을 박스와 선으로 연결하고 본부장·팀장 이름을 적은 조직 구조도"
      - minor_code: "MGT-13"
        minor_name: "회사 소개서"
        definition: "회사 개요(설립연도·대표·임직원·매출), 연혁, 사업 영역, 주요 거래처를 소개하는 대외용 회사 소개 문서. 이달 소식을 싣는 거래처 월간 소식지(CUS-08)와 달리 연혁과 사업 영역을 소개하는 대외용 문서"
      - minor_code: "MGT-14"
        minor_name: "신년 경영 방침서"
        definition: "새해 경영 슬로건과 매출·영업이익 등 경영 목표, 핵심 전략, 부문별 중점 과제, 대표이사 메시지를 담은 연초 방침 문서. 다음 해 월별 계획과 추진 과제 표가 중심인 연간사업계획서(MGT-02)와 달리 슬로건·대표이사 메시지·핵심 전략 서술이 중심"

  - major: "영업/제안"
    items:
      - minor_code: "SAL-01"
        minor_name: "견적서"
        definition: "공급자가 수신처에 품목별 규격·수량·단가·공급가액·세액과 합계금액을 제시하는 거래 조건 문서. 견적서와 거래명세표가 한 양식에 합쳐진 문서도 해당. 견적일·유효기간·결제조건이 있으면 공급자·공급받는자 사업자등록번호와 공급가액·세액이 함께 적혀 있어도 견적서"
      - minor_code: "SAL-02"
        minor_name: "거래처 방문일지"
        definition: "영업 담당자가 거래처를 방문한 날짜·시간, 거래처 정보, 방문 목적과 요구사항, 상담 결과와 향후 계획을 기록한 영업 활동 일지"
      - minor_code: "SAL-03"
        minor_name: "재고조사표"
        definition: "물류센터·창고의 구역별 품목에 대해 장부 수량과 실제로 센 실사 수량을 비교해 차이를 적는 재고 실사 표. 조사자·입회자·확인자 서명란이 있음. 품목별 장부·실사·차이 수량이 중심이며, 재고 실사를 점검한 결과를 서술하는 감사보고서와 구분"
      - minor_code: "SAL-04"
        minor_name: "발주서"
        definition: "발주처가 공급처에 품목·수량·단가와 납기일·납품장소를 정해 물품을 주문하는 문서. 발주번호, 발주일, 공급처 정보, 품목별 금액과 합계가 기재됨. 판매자가 가격을 제시하는 견적서(SAL-01), 납품된 물품을 확인하는 납품확인서(SAL-05)와 구분"
      - minor_code: "SAL-05"
        minor_name: "납품확인서"
        definition: "납품된 물품의 수량과 상태를 납품처가 확인하고 인수했음을 서명하는 문서. 납품번호, 발주번호, 납품일, 품목별 발주수량·납품수량, 불량·판정, 인수자가 기재되며 입고 검수(유통기한·온도) 항목이 붙은 양식도 해당. 물품을 주문하는 발주서(SAL-04)와 달리 납품 결과를 확인하는 문서"
      - minor_code: "SAL-07"
        minor_name: "제안서"
        definition: "거래처에 보내는 상품 공급 제안서. 제안 배경, 제안 상품 구성과 공급가·최소 발주, 거래 조건(결제·배송), 기대 효과가 있음. 단가 표 중심의 견적서(SAL-01)와 달리 제안 배경과 효과를 서술함"
      - minor_code: "SAL-08"
        minor_name: "프로모션 기획서"
        definition: "행사명·기간·대상 채널·목적과 상품별 행사 유형(1+1, 할인, 증정), 예상 매출·판촉비·ROI 또는 주차별 운영 계획을 담은 사전 행사 기획 문서. 끝난 행사의 실적표(SAL-09)가 아님"
      - minor_code: "SAL-09"
        minor_name: "판촉 행사 결과표"
        definition: "끝난 판촉 행사의 품목별 계획 수량 대비 실적 수량·달성률·매출·판촉비, 또는 거래처별 행사 매출과 행사 전후 비교, 총평을 적은 결과 문서. 계획 단계의 프로모션 기획서(SAL-08)와 달리 실적과 달성률이 중심"
      - minor_code: "SAL-10"
        minor_name: "상품 카탈로그"
        definition: "상품별 이미지, 상품명, 규격, 코드, 공급가를 카드 격자나 목록으로 나열한 상품 안내 책자. 여러 상품을 이미지와 함께 나열하며, 상품 하나의 포장 단위·바코드를 자세히 적은 상품 규격서(SAL-19)와 구분"
      - minor_code: "SAL-11"
        minor_name: "거래처 등급 기준표"
        definition: "S·A·B·C·D 등급별 연 매출·결제 이행·거래 기간 기준과 공급가 할인·결제 조건·판촉 지원 혜택, 평가 항목 배점(매출·수금 등)을 정리한 기준표"
      - minor_code: "SAL-12"
        minor_name: "진열 계획도"
        definition: "매장 곤돌라의 단별 상품 배치(정면도)나 매장 평면의 구역·통로 배치를 색 블록 도면으로 그린 진열 계획과 구역별 카테고리·주력 상품·진열 원칙. 비상구·대피 경로를 표시한 비상 대피 안내도(LEG-10)와 달리 상품·카테고리 배치가 중심"
      - minor_code: "SAL-13"
        minor_name: "행사 부스 운영 계획서"
        definition: "박람회·행사 부스의 도면(시식대·진열대·상담 테이블), 일정, 인력 배치와 역할, 준비 물품, 예산을 적은 운영 계획서. 상품별 행사 유형을 적는 프로모션 기획서(SAL-08)와 달리 부스 도면·인력 배치·준비 물품이 중심"
      - minor_code: "SAL-14"
        minor_name: "시식 행사 안내 포스터"
        definition: "큰 글씨 제목과 상품명, 행사 날짜·시간·장소, 시식·구매 혜택을 컬러 배경에 크게 배치한 홍보 포스터. 여러 일정을 달력에 모은 거래처 월간 행사 캘린더(CUS-15)와 달리 한 행사를 크게 홍보"
      - minor_code: "SAL-15"
        minor_name: "거래처 담당자 연락처 명부"
        definition: "거래처별 담당자 이름, 부서, 직책, 휴대전화, 이메일을 나열한 연락처 명부(표 또는 지역별 카드). 거래처 등록 정보(사업자등록번호 등)를 적는 거래처 등록신청서(CUS-04)와 달리 담당자 연락처만 나열"
      - minor_code: "SAL-16"
        minor_name: "파렛트 적재 기준표"
        definition: "상품별 박스 규격·중량, 파렛트 단당 박스 수, 적재 단수, 파렛트당 박스 수와 단 적재 패턴 그림, 높이·랩핑 기준을 정리한 표. 상품 한 개의 사양을 적은 상품 규격서(SAL-19)와 달리 상품별 적재 단수와 적재 패턴이 중심"
      - minor_code: "SAL-17"
        minor_name: "제품 라벨 시안"
        definition: "제품명, 식품유형, 내용량, 원재료명, 영양정보, 보관방법, 소비기한, 알레르기, 제조원과 바코드를 포장 라벨 모양으로 배치한 인쇄 전 시안과 디자인·품질·승인란. 표 형식의 상품 규격서(SAL-19)와 달리 포장 라벨 모양으로 배치하고 승인란이 있음"
      - minor_code: "SAL-18"
        minor_name: "경쟁사 제품 비교표"
        definition: "우리 제품과 경쟁사 제품을 열로 놓고 판매가·용량·100g당 가격·원료·유통 채널·행사·장단점(또는 별점)을 같은 항목으로 맞비교한 표"
      - minor_code: "SAL-19"
        minor_name: "상품 규격서"
        definition: "상품 하나의 상품명·코드·바코드(GTIN)·규격·제조원·원산지·보관·소비기한과 낱개·박스·파렛트 포장 단위별 크기·중량·입수를 기재한 규격 사양서. 여러 상품을 나열하는 상품 카탈로그(SAL-10)나 라벨 모양으로 배치한 제품 라벨 시안(SAL-17)과 달리 상품 하나의 사양을 표로 적음"
      - minor_code: "SAL-20"
        minor_name: "지역별 영업 담당 구역도"
        definition: "서울·경기·강원 등 지역을 타일 지도나 목록으로 나누어 담당자별 색으로 표시하고 담당 구역·거래처 수·매출 목표를 적은 구역도. 한 거래처의 찾아오는 길을 그린 거래처 위치 약도(CUS-12)와 달리 지역별 담당자 배치가 중심"

  - major: "고객/거래처"
    items:
      - minor_code: "CUS-01"
        minor_name: "비밀유지계약서"
        definition: "원사업자와 수급사업자 사이에서 제공하는 기술자료의 명칭·범위, 제공받는 목적, 사용기간·반환(폐기)일, 보유 임직원 명단을 정해 비밀 유지를 약정하는 계약서(NDA)"
      - minor_code: "CUS-02"
        minor_name: "가맹계약서"
        definition: "가맹본부와 가맹점사업자가 영업표지(브랜드) 사용, 최초가맹금·계속가맹금(로열티), 영업지역 보호, 교육훈련 조건을 정해 맺는 프랜차이즈 계약서"
      - minor_code: "CUS-04"
        minor_name: "거래처 등록신청서"
        definition: "결재란 아래 신청일·신청 부서와 신규 거래처의 상호·사업자등록번호·대표자·업태 등 정보를 적고 첨부 서류(사업자등록증 사본 등) 체크란이 있는 거래처 등록 신청 서식. 세무서가 발급한 사업자등록증(CUS-11)과 달리 사내 결재란이 있는 신청 서식"
      - minor_code: "CUS-05"
        minor_name: "거래처 신용평가표"
        definition: "거래처 정보 아래 평가 항목별 배점·득점 표와 합계, A~D 신용 등급과 평가 의견을 적은 거래처 신용 평가 서식. 평가 대상이 거래처이고 거래처별 득점이 있어, 등급별 기준과 혜택만 정리한 거래처 등급 기준표(SAL-11)나 지원자를 평가하는 면접평가표(HR-14)와 구분"
      - minor_code: "CUS-06"
        minor_name: "클레임 처리 보고서"
        definition: "접수번호·접수일·거래처 등 접수 정보와 클레임 내용, 원인 분석, 조치 내용, 재발 방지 대책, 처리 결과를 적은 고객 클레임 처리 보고서. 거래처의 클레임을 처리하는 문서로, 재해자·부상 부위를 적는 산업재해 발생 보고서(LEG-04)와 달리 접수번호·거래처와 처리 결과가 중심"
      - minor_code: "CUS-07"
        minor_name: "거래처 계약 갱신 통지서"
        definition: "거래처 대표이사를 수신으로 하는 공문 형식으로 기존 거래 계약 만료를 알리고 계약 기간·결제 조건 등 현행과 갱신 후 조건을 표로 비교해 회신을 요청하는 통지서. 서술형 본문이 중심인 우편 문서(LEG-12)와 달리 현행·갱신 조건 비교표가 있음"
      - minor_code: "CUS-08"
        minor_name: "거래처 월간 소식지"
        definition: "거래처에 보내는 ○월호 소식지로 이달의 신제품, 이달의 프로모션 기간·내용, 물류 공지와 문의처를 실은 뉴스레터. 달력 칸에 일정을 표시하는 거래처 월간 행사 캘린더(CUS-15)와 달리 신제품·프로모션·공지를 글로 싣는 뉴스레터"
      - minor_code: "CUS-09"
        minor_name: "거래처 출입 허가증"
        definition: "허가번호와 방문 회사·방문자·차량번호·방문 목적·면담 담당·허가 일시를 적고 출입 허용 구역 체크와 안전 수칙, 신청·면담자·보안담당 서명란이 있는 방문자 출입 허가증. 차량에 붙이는 사내 주차 허가증(LEG-16)과 달리 방문자의 출입 허용 구역과 안전 수칙이 있음"
      - minor_code: "CUS-10"
        minor_name: "거래처 대표자 인감증명서"
        definition: "발급번호와 성명·생년월일·주소·용도를 적고 인영(인감 도장) 칸과 '위 인감이 신고되어 있음을 증명합니다' 문구, 구청장 직인이 있는 인감증명서"
      - minor_code: "CUS-11"
        minor_name: "사업자등록증"
        definition: "세무서가 발급한 법인사업자 사업자등록증으로 등록번호와 법인명·대표자·개업 연월일·법인등록번호·사업장 소재지·사업의 종류(업태·종목)와 발급일·세무서장 직인이 적힌 증명서. 사내에서 쓰는 신청 서식인 거래처 등록신청서(CUS-04)와 달리 세무서가 발급한 증명서"
      - minor_code: "CUS-12"
        minor_name: "거래처 위치 약도"
        definition: "거래처 이름의 위치 약도로 도로·건물·목적지를 그린 지도 그림과 주소·전화·담당자, 대중교통·주차 등 오시는 길 안내를 적은 문서. 지역별 담당자 배치를 나타내는 지역별 영업 담당 구역도(SAL-20)와 달리 한 거래처의 찾아오는 길을 안내"
      - minor_code: "CUS-13"
        minor_name: "거래처 위촉장"
        definition: "겹테두리 안에 호수, 거래처명과 대표 성명, 자문위원 등 위촉 직함과 위촉 기간을 적고 대표이사 직인을 찍어 위촉을 알리는 증서. 감사 문구가 중심인 거래처 감사장(CUS-14)과 달리 직함과 기간이 있음"
      - minor_code: "CUS-14"
        minor_name: "거래처 감사장"
        definition: "장식 테두리 안에 거래처명과 거래 연차, 신뢰와 협력에 감사하는 문구를 적고 대표이사 직인을 찍은 증서. 위촉 직함·위촉 기간이 있는 거래처 위촉장(CUS-13)과 달리 감사 문구가 중심"
      - minor_code: "CUS-15"
        minor_name: "거래처 월간 행사 캘린더"
        definition: "한 달 달력 칸에 정기 배송·프로모션·시식 행사·물류센터 휴무·가격 개정 일정을 색으로 표시하고 범례를 단 거래처용 행사 일정 달력. 글 기사 중심의 거래처 월간 소식지(CUS-08)와 달리 달력 칸에 일정을 색으로 표시"

  - major: "법무/총무"
    items:
      - minor_code: "LEG-01"
        minor_name: "상가건물 임대차계약서"
        definition: "큰 제목이 '상가건물 임대차 표준계약서'인 임대차 계약서. 오른쪽 위 머리글에 '상가건물 임대차 표준계약서 (2024. 5. 8 개정)'이 적혀 있음. 본문 서식은 LEG-02와 같음. 계약 조건을 문장으로 요약한 서술형도 해당"
      - minor_code: "LEG-02"
        minor_name: "표준임대차계약서"
        definition: "큰 제목이 '표준임대차계약서'인 임대차 계약서. 오른쪽 위 머리글에 '표준임대차계약서'가 적혀 있음. 본문 서식은 LEG-01과 같음"
      - minor_code: "LEG-04"
        minor_name: "산업재해 발생 보고서"
        definition: "결재란 아래 발생 일시·장소·재해자·재해 유형·부상 부위·치료 정도와 발생 경위, 원인, 조치 사항, 재발 방지 대책을 적은 사업장 산업재해 보고서. 거래처 클레임을 처리하는 클레임 처리 보고서(CUS-06)와 달리 재해자·재해 유형·부상 부위가 중심"
      - minor_code: "LEG-05"
        minor_name: "HACCP 인증서"
        definition: "식품 보관·유통 업소의 업소명·대표자·소재지·인증 품목·인증번호·유효기간을 적고 인증 기관장이 위해요소중점관리기준(HACCP) 적용 업소임을 인증하는 증서. 교육 이수를 확인하는 위생교육 이수확인서(HR-08)나 시험 결과 표인 품질검사 성적서(LEG-06)와 달리 인증 기관장이 업소를 인증"
      - minor_code: "LEG-06"
        minor_name: "품질검사 성적서"
        definition: "성적서 번호와 의뢰인·시료명·접수일·검사일을 적고 검사 항목·기준·결과·판정 표와 종합 판정을 적은 시험·검사 성적서. 검사 대상이 시료(제품)이며, 사람의 건강진단 결과를 적는 건강진단결과서(HR-09)와 구분"
      - minor_code: "LEG-07"
        minor_name: "원산지 증명서"
        definition: "CERTIFICATE OF ORIGIN 부제와 수출자·수입자·운송 정보, 품명·HS 코드·수량·중량·원산지 품목 표, 발급 기관 확인이 있는 원산지 증명서. 원산지가 중심이며, 신고 수리를 확인하는 수입식품 신고필증(LEG-08)과 구분"
      - minor_code: "LEG-08"
        minor_name: "수입식품 신고필증"
        definition: "신고번호와 신고일·수리일·영업자·제품명·수출국·중량 등 수입식품 신고 사항을 적고 신고가 수리되었음을 확인하는 수입식품등 수입신고 확인증. 원산지를 증명하는 원산지 증명서(LEG-07)와 달리 신고가 수리되었음을 확인"
      - minor_code: "LEG-09"
        minor_name: "차량운행일지"
        definition: "차량번호·차종·운전자를 적고 일자별 출발지·도착지·출발 km·도착 km·거리·목적을 기록한 운행 표와 주유 기록이 있는 업무 차량 일지"
      - minor_code: "LEG-10"
        minor_name: "비상 대피 안내도"
        definition: "층별 평면도 그림에 현재 위치·대피 경로·비상구·소화기 위치를 표시하고 화재 발생 시 행동 요령을 적은 대피 안내도. 상품 진열 배치를 그린 진열 계획도(SAL-12)와 달리 대피 경로와 비상구가 중심"
      - minor_code: "LEG-11"
        minor_name: "위임장"
        definition: "위임인(회사 상호·대표자·사업자번호)과 수임인(성명·소속)의 정보, 위임 사항과 위임 기간을 적고 위임인이 날인하는 위임장"
      - minor_code: "LEG-12"
        minor_name: "내용증명"
        definition: "큰 제목 '내용증명'과 수신인·발신인 주소, 제목 아래 번호 매긴 본문으로 대금 지급·계약 이행 등을 요구하거나 통지하는 우편 문서. 현행·갱신 조건 비교표로 계약 갱신을 알리는 거래처 계약 갱신 통지서(CUS-07)와 달리 서술형 본문이 중심"
      - minor_code: "LEG-13"
        minor_name: "사내 공고문"
        definition: "색 띠의 '공고' 머리와 공고 번호·게시 기간, 휴무·소방 훈련·시스템 점검 등 안내 제목, 일시·대상·내용을 적고 인사총무팀 명의로 게시하는 사내 공지문. 특정 직원 개인을 대상으로 한 인사발령통지서(HR-07)와 달리 전 직원에게 안내"
      - minor_code: "LEG-14"
        minor_name: "개인정보 수집·이용 동의서"
        definition: "수집·이용 목적, 수집 항목, 보유·이용 기간, 제3자 제공 여부 표와 동의·미동의 체크, 성명·서명란이 있는 개인정보 동의 서식"
      - minor_code: "LEG-15"
        minor_name: "문서수발대장"
        definition: "결재란 아래 번호·일자·수신/발신 구분·문서번호·문서 제목·상대 기관·담당자·확인 열로 주고받은 문서를 기록한 대장. 어음 한 건을 한 줄에 적는 어음관리대장(FIN-20)과 달리 주고받은 문서를 한 줄씩 기록"
      - minor_code: "LEG-16"
        minor_name: "주차 허가증"
        definition: "'주차 허가증' 머리 아래 큰 차량번호와 허가번호·성명·소속·차종·주차 구역·유효 기간을 적고 차량 부착 안내가 있는 사내 주차 허가증. 방문자의 출입 허용 구역이 있는 거래처 출입 허가증(CUS-09)과 달리 차량번호와 주차 구역이 중심"
      - minor_code: "LEG-17"
        minor_name: "법인 등기사항증명서"
        definition: "고유번호와 상호·본점·공고 방법·1주의 금액·발행주식 등 등기 사항, 목적 목록, 임원에 관한 사항 표가 있는 법인 등기사항전부증명서. 주주별 지분 목록인 주주명부(FIN-17)와 달리 상호·본점·목적·임원 등 등기 사항이 중심"
      - minor_code: "LEG-18"
        minor_name: "법률 자문 의견서"
        definition: "의뢰인·작성일·주제·관련 부서를 적고 사안 개요, 질의, 의견, 결론 순으로 서술한 법률 검토 의견서"

  - major: "기타"
    items:
      - minor_code: "ETC-00"
        minor_name: "분류불가 (신규 분류 제안)"
        definition: "분류 체계의 소분류에 해당하지 않는 사외 양식이나 미등록 문서로 신규 분류 제안(NEW-xx)이 필요한 문서. 문서 종류가 소분류와 같다면 표 양식이 아니라 항목을 문장으로 풀어 쓴 서술형이어도 해당 소분류로 분류하고 여기에 넣지 않음"
