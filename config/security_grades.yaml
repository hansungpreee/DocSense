# 보안 등급표: 소분류 코드 → 기본 등급 (src/engine/security.py가 읽음)
# 4단계: 기밀·대외비·사내한정·공개 (11/16 결정, 11/17 「극비」→「기밀」: ISMS-P 2.1.3 해설 예시). 분류 체계(taxonomy.yaml) 100종 전체. 「기타」(ETC-00·NEW-xx)는 등급을 매기지 않는다.
# 판단 기준: 기밀 = 공개 의무 없는 경영·재무·전략 정보, 대외비 = 개인정보 또는 정해진 상대방에게만 열린 정보,
#           사내한정 = 사외 공개용은 아닌 업무 문서, 공개 = 대외 배포·게시를 전제로 만든 문서.
# 근거(basis)는 조문 대부분을 2차 자료로 확인한 것으로, 「보안 등급 법령 연결 기준」 보고서를 따른 가상 회사 HS리테일용 제안이며 법률 자문이 아니다.
# 문서별 예외(세금계산서 공급받는자가 개인 등)는 엔진이 알 수 없어 담당자가 수동 조정한다.

