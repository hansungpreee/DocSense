# 실험용: config/taxonomy.yaml(기존 19종 + 기타) + 확장 38종(FIN-11~22, MGT-03~14, SAL-07~20) 정의 초안.
# 코드는 분류체계 도표의 임시 코드다. 팀 합의 전이라 config/taxonomy.yaml은 바꾸지 않고 run_expansion.py --taxonomy로만 쓴다.
# config/taxonomy.yaml
# PRD 5절/8절 기준 VLM 문서 분류 체계 정의서 (대분류 6종, 소분류 19종 + 기타 1종)

taxonomy:
  - major: "인사/채용"
    items:
      - minor_code: "HR-01"
        minor_name: "이력서"
        definition: "지원자의 성명·연락처·증명사진 등 인적사항과 학력사항, 경력사항, 자격면허 표가 포함된 채용 지원 문서"
      - minor_code: "HR-02"
        minor_name: "근로계약서"
        definition: "사업주와 근로자 간의 근로계약기간, 근무장소, 소정근로시간, 임금(월급·시급), 연차유급휴가를 약정한 고용 계약서"
      - minor_code: "HR-03"
        minor_name: "연봉 실수령액표"
        definition: "연봉에서 4대보험(국민연금·건강보험·장기요양·고용보험)과 소득세·지방소득세를 뺀 월 실수령액을 나열한 급여표. 연봉 구간별 기준표 형태와, 직원별(사번·성명·부서·직급)로 연봉·공제액·월 실수령액을 적은 형태 모두 해당. 국민연금공단에 가입자별 소득총액을 신고하는 서식(FIN-06)과 달리 월 실수령액이 중심"

  - major: "재무/회계"
    items:
      - minor_code: "FIN-01"
        minor_name: "합계잔액시산표"
        definition: "표 중앙의 '계정과목' 열을 기준으로 좌측에 '차변(잔액·합계)', 우측에 '대변(합계·잔액)'이 대칭 구조로 배치된 재무 검증 표"
      - minor_code: "FIN-02"
        minor_name: "원가명세서"
        definition: "제조 과정의 I.재료비, II.노무비, III.경비를 더한 당기총제조비용에 기초·기말재공품원가를 가감하여 '당기제품제조원가'를 산출하는 명세서"
      - minor_code: "FIN-03"
        minor_name: "손익계산서"
        definition: "일정 기간의 I.매출액, II.매출원가, III.매출총이익, IV.판매비와관리비, V.영업손익, VI.영업외수익, VII.영업외비용, VIII.당기순손익이 위에서 아래로 나열된 경영성과 재무제표"
      - minor_code: "FIN-04"
        minor_name: "총수입금액 및 필요경비명세서"
        definition: "사업자의 총수입금액과 매출원가, 일반관리비 등 필요경비 산출 내역을 집계하여 세무서에 제출하는 법정 서식"
      - minor_code: "FIN-05"
        minor_name: "주요경비지출명세서"
        definition: "주요경비 지출 내역을 거래처(공급자)별 상호(성명), 사업자등록번호(주민등록번호), 매수, 거래품목, 거래금액으로 일련번호를 붙여 기재하는 세무 명세서"
      - minor_code: "FIN-06"
        minor_name: "소득총액신고서"
        definition: "국민연금공단에 사업장 가입자(근로자)별 신고유형, 취득일자, 실제 근무시작일, 휴직일수와 전년도 소득총액을 신고하는 다인 명부 형태의 서식"
      - minor_code: "FIN-07"
        minor_name: "사업소득 원천징수영수증"
        definition: "징수의무자와 소득자 인적사항, 지급총액, 세율(3%), 원천징수세액(소득세·지방소득세)이 표로 기재된 영수증 및 지급명세서"
      - minor_code: "FIN-08"
        minor_name: "소득·세액 공제신고서"
        definition: "연말정산을 위해 근로소득자 또는 종교인이 부양가족 인적공제 명세와 연금·보험료·의료비·신용카드 등 공제 금액을 직접 기입하는 신고서"
      - minor_code: "FIN-09"
        minor_name: "감사보고서"
        definition: "회사 내부감사팀이 이사회 등에 보고하는 감사 보고서. 감사기간·감사목적·감사구분·피감사부·감사원, 감사결과 및 주요 발견 사항, 개선 권고 사항, 결론이 서술형과 표로 작성됨. 결산·매출채권뿐 아니라 재고실사·가맹점 로열티·문서보안 등 감사 대상과 관계없이 해당하며, 외부 감사인의 감사보고서도 여기에 해당"
      - minor_code: "FIN-11"
        minor_name: "외상매출금 연령분석표"
        definition: "거래처별 외상매출금 잔액을 30일 이내·31~60일·61~90일·91일 이상 경과 기간으로 나누어 집계하고 합계를 낸 채권 연령 분석표. 거래처별 매입·매출 실적을 분석하는 거래처 매입매출현황 분석표(MGT-01)와 달리 미수 잔액의 경과 기간 구간이 열로 나뉨"
      - minor_code: "FIN-12"
        minor_name: "환율 변동 손익표"
        definition: "외화 거래(USD·EUR·JPY·CNY)별 외화금액, 거래일 환율과 기말(결제일) 환율, 원화 장부금액과 평가금액의 차이로 외환차손익·외화환산손익을 계산한 표"
      - minor_code: "FIN-13"
        minor_name: "판매장려금(리베이트) 정산서"
        definition: "거래처의 정산 기간 매출액에 매출 구간별 또는 품목군별 목표 달성에 따른 장려금 요율을 적용해 판매장려금 금액, 지급 예정일, 입금 계좌를 정리한 정산 문서. 상품 단가 표가 중심인 견적서(SAL-01)와 달리 정산 기간 매출에 요율을 적용한 장려금 계산이 중심"
      - minor_code: "FIN-14"
        minor_name: "입금확인증"
        definition: "입금자, 입금일시, 입금 금액(한글 금액 포함), 입금 계좌, 거래번호가 적히고 입금 사실을 확인한다는 문구와 발급 기관의 직인이 있는 짧은 확인서. 요율 계산이 있는 판매장려금 정산서(FIN-13)와 달리 입금 사실만 확인"
      - minor_code: "FIN-15"
        minor_name: "대출금 상환계획표"
        definition: "대출처·대출원금·금리·기간·상환방식과 함께 회차(또는 연차)별 납입일, 원금, 이자, 납입액, 잔액을 나열한 상환 일정표. 회차별 원금·이자·잔액이 이어지는 일정표로, 자산별 상각 계산을 나열한 고정자산 감가상각 명세서(FIN-18)와 구분"
      - minor_code: "FIN-16"
        minor_name: "이행보증보험증권"
        definition: "보증보험회사가 보험계약자와 피보험자, 증권번호, 보험가입금액, 보험기간, 보증 대상 계약을 기재하고 약관 요약과 직인이 있는 계약이행보증 증권. 계약 당사자가 맺는 계약서(CUS-01·02)가 아니라 보증보험회사가 발행하는 증권"
      - minor_code: "FIN-17"
        minor_name: "주주명부"
        definition: "주주별 성명(상호), 등록번호, 소유 주식수, 지분율, 주식 종류와 발행주식 총수를 적은 명부. 대표이사 확인란이 있음. 주주별 지분 목록이 중심이며, 상호·본점·임원 등 등기 사항 표가 있는 법인 등기사항증명서(LEG-17)와 구분"
      - minor_code: "FIN-18"
        minor_name: "고정자산 감가상각 명세서"
        definition: "건물·기계장치·차량운반구·비품 등 고정자산별 취득가액, 내용연수, 전기말 상각누계액, 당기 상각비, 장부가액을 정액법으로 나열한 명세서"
      - minor_code: "FIN-19"
        minor_name: "현금출납부"
        definition: "일자별 적요와 입금·출금·잔액 열이 있고 전일 이월과 합계가 있는 현금 장부. 거래가 시간 순으로 이어지며 잔액이 계속 갱신됨. 계정과목별 차변·대변 잔액을 모은 합계잔액시산표(FIN-01)와 달리 날짜 순으로 입금·출금과 잔액이 이어짐"
      - minor_code: "FIN-20"
        minor_name: "어음관리대장"
        definition: "어음번호, 받을어음·지급어음 구분, 거래처, 발행일, 만기일, 금액, 지급은행, 보관·추심·결제 상태를 한 줄씩 기록한 어음 장부. 일자별 입출금이 이어지는 현금출납부(FIN-19)와 달리 어음 한 건이 한 줄"
      - minor_code: "FIN-21"
        minor_name: "퇴직연금 가입 내역서"
        definition: "금융회사(은행·증권·보험)가 발급한 확정기여형(DC)·확정급여형(DB)·IRP 퇴직연금의 가입자 또는 가입자별 부담금·적립금, 운용 상품별 평가금액·비중·수익률을 정리한 내역서"
      - minor_code: "FIN-22"
        minor_name: "정부 보조금 교부 결정 통지서"
        definition: "정부·공공기관이 사업명, 교부결정액, 사업기간, 교부 방법과 조건(용도 제한, 정산 보고 등)을 기업에 통지하는 공문 또는 결정서. 기관장 직인이 있음. 거래처에 보내는 계약 갱신 통지서(CUS-07)나 우편 문서인 내용증명(LEG-12)이 아니라 정부·공공기관이 기업에 보조금 결정을 통지"

  - major: "경영/전략"
    items:
      - minor_code: "MGT-01"
        minor_name: "거래처 매입매출현황 분석표"
        definition: "주요 거래처별 매입 금액·비율, 매출 금액·비율, 순이익 금액·기여도와 각각의 전년대비 증감률을 비교 분석한 경영 현황 보고서"
      - minor_code: "MGT-03"
        minor_name: "SWOT 분석서"
        definition: "분석 대상 사업의 강점(S)·약점(W)·기회(O)·위협(T)을 나누어 항목별로 나열한 분석 문서. 2×2 칸 또는 표로 배치되고 SO·WO·ST·WT 전략이 이어질 수 있음"
      - minor_code: "MGT-04"
        minor_name: "신제품 출시 계획서"
        definition: "신제품 하나의 이름·규격·소비자가·목표 고객, 개발부터 출시까지의 단계별 일정, 판매 목표와 마케팅 예산을 담은 사내 계획서. 시장 전체 조사(MGT-05)나 물류센터 투자 검토(MGT-08)가 아니라 제품 하나의 출시 일정이 중심"
      - minor_code: "MGT-05"
        minor_name: "시장조사보고서"
        definition: "특정 제품 시장의 규모 추이 그래프, 업체별 점유율, 소비자 설문(구매 요인 등) 결과와 시사점을 정리한 조사 보고서. 경쟁 제품을 항목별로 맞비교하는 표(SAL-18)와 달리 시장 전반의 수치가 중심"
      - minor_code: "MGT-06"
        minor_name: "프로젝트 일정표(간트차트)"
        definition: "업무 항목과 담당자를 세로로, 주차(또는 월)를 가로로 두고 일정 구간을 막대로 채운 간트 차트와 마일스톤"
      - minor_code: "MGT-07"
        minor_name: "업무 처리 매뉴얼"
        definition: "특정 업무(거래처 등록, 반품, 입고 검수 등)의 목적·적용 범위와 단계별 담당자·처리 내용·소요 기간(또는 업무 흐름도), 유의사항, 개정 이력을 적은 표준 절차서. 직무의 자격·역량을 설명하는 직무기술서(HR-15)와 달리 처리 단계가 중심"
      - minor_code: "MGT-08"
        minor_name: "신규 물류센터 사업타당성 검토서"
        definition: "신규 물류센터 후보지 비교, 총 투자비 구성, NPV·IRR·투자 회수 기간 같은 수익성 지표나 시나리오별(낙관·기준·비관) 분석과 결론을 담은 투자 검토 문서. 제품 하나의 출시 일정이 중심인 신제품 출시 계획서(MGT-04)와 달리 투자비와 수익성 지표가 중심"
      - minor_code: "MGT-09"
        minor_name: "사업장 현황표"
        definition: "본사·물류센터·지점·영업소 등 사업장별 소재지, 면적, 임차·자가 구분, 인원, 기능, 개설일을 나열한 현황표. 건물 임대차 조건을 정하는 계약서(LEG-01·02)가 아니라 사업장별 현황을 나열"
      - minor_code: "MGT-10"
        minor_name: "ESG 경영 보고서"
        definition: "환경(온실가스·에너지·폐기물), 사회(임직원·안전·교육), 지배구조(이사회·윤리) 영역별 지표를 연도별 표나 지표 카드로 보여 주는 지속가능경영 보고서"
      - minor_code: "MGT-11"
        minor_name: "리스크 관리 대장"
        definition: "리스크 번호, 리스크명, 분류, 발생 가능성·영향도 점수와 등급, 대응방안, 담당자, 상태를 기록한 대장. 5×5 위험 매트릭스가 함께 있을 수 있음"
      - minor_code: "MGT-12"
        minor_name: "조직도"
        definition: "대표이사 아래 본부와 팀을 박스와 선으로 연결하고 본부장·팀장 이름을 적은 조직 구조도"
      - minor_code: "MGT-13"
        minor_name: "회사 소개서"
        definition: "회사 개요(설립연도·대표·임직원·매출), 연혁, 사업 영역, 주요 거래처를 소개하는 대외용 회사 소개 문서. 이달 소식을 싣는 거래처 월간 소식지(CUS-08)와 달리 연혁과 사업 영역을 소개하는 대외용 문서"
      - minor_code: "MGT-14"
        minor_name: "신년 경영 방침서"
        definition: "새해 경영 슬로건과 매출·영업이익 등 경영 목표, 핵심 전략, 부문별 중점 과제, 대표이사 메시지를 담은 연초 방침 문서. 다음 해 월별 계획과 추진 과제 표가 중심인 연간사업계획서(MGT-02)와 달리 슬로건·대표이사 메시지·핵심 전략 서술이 중심"

  - major: "영업/제안"
    items:
      - minor_code: "SAL-01"
        minor_name: "견적서"
        definition: "공급자와 수신처 정보, 합계금액, 품목별 규격·수량·단가·공급가액·세액 내역 표가 포함된 표준 견적서 및 견적서·거래명세표 통합 문서"
      - minor_code: "SAL-02"
        minor_name: "거래처 방문일지"
        definition: "영업 담당자의 방문일자, 방문시간, 거래처 정보, 방문목적 및 요구사항, 상담 결과 및 향후 계획이 기록된 영업 일지"
      - minor_code: "SAL-07"
        minor_name: "제안서"
        definition: "거래처에 보내는 상품 공급 제안서. 제안 배경, 제안 상품 구성과 공급가·최소 발주, 거래 조건(결제·배송), 기대 효과가 있음. 단가 표 중심의 견적서(SAL-01)와 달리 제안 배경과 효과를 서술함"
      - minor_code: "SAL-08"
        minor_name: "프로모션 기획서"
        definition: "행사명·기간·대상 채널·목적과 상품별 행사 유형(1+1, 할인, 증정), 예상 매출·판촉비·ROI 또는 주차별 운영 계획을 담은 사전 행사 기획 문서. 끝난 행사의 실적표(SAL-09)가 아님"
      - minor_code: "SAL-09"
        minor_name: "판촉 행사 결과표"
        definition: "끝난 판촉 행사의 품목별 계획 수량 대비 실적 수량·달성률·매출·판촉비, 또는 거래처별 행사 매출과 행사 전후 비교, 총평을 적은 결과 문서. 계획 단계의 프로모션 기획서(SAL-08)와 달리 실적과 달성률이 중심"
      - minor_code: "SAL-10"
        minor_name: "상품 카탈로그"
        definition: "상품별 이미지, 상품명, 규격, 코드, 공급가를 카드 격자나 목록으로 나열한 상품 안내 책자. 여러 상품을 이미지와 함께 나열하며, 상품 하나의 포장 단위·바코드를 자세히 적은 상품 규격서(SAL-19)와 구분"
      - minor_code: "SAL-11"
        minor_name: "거래처 등급 기준표"
        definition: "S·A·B·C·D 등급별 연 매출·결제 이행·거래 기간 기준과 공급가 할인·결제 조건·판촉 지원 혜택, 평가 항목 배점(매출·수금 등)을 정리한 기준표"
      - minor_code: "SAL-12"
        minor_name: "진열 계획도"
        definition: "매장 곤돌라의 단별 상품 배치(정면도)나 매장 평면의 구역·통로 배치를 색 블록 도면으로 그린 진열 계획과 구역별 카테고리·주력 상품·진열 원칙. 비상구·대피 경로를 표시한 비상 대피 안내도(LEG-10)와 달리 상품·카테고리 배치가 중심"
      - minor_code: "SAL-13"
        minor_name: "행사 부스 운영 계획서"
        definition: "박람회·행사 부스의 도면(시식대·진열대·상담 테이블), 일정, 인력 배치와 역할, 준비 물품, 예산을 적은 운영 계획서. 상품별 행사 유형을 적는 프로모션 기획서(SAL-08)와 달리 부스 도면·인력 배치·준비 물품이 중심"
      - minor_code: "SAL-14"
        minor_name: "시식 행사 안내 포스터"
        definition: "큰 글씨 제목과 상품명, 행사 날짜·시간·장소, 시식·구매 혜택을 컬러 배경에 크게 배치한 홍보 포스터. 여러 일정을 달력에 모은 거래처 월간 행사 캘린더(CUS-15)와 달리 한 행사를 크게 홍보"
      - minor_code: "SAL-15"
        minor_name: "거래처 담당자 연락처 명부"
        definition: "거래처별 담당자 이름, 부서, 직책, 휴대전화, 이메일을 나열한 연락처 명부(표 또는 지역별 카드). 거래처 등록 정보(사업자등록번호 등)를 적는 거래처 등록신청서(CUS-04)와 달리 담당자 연락처만 나열"
      - minor_code: "SAL-16"
        minor_name: "파렛트 적재 기준표"
        definition: "상품별 박스 규격·중량, 파렛트 단당 박스 수, 적재 단수, 파렛트당 박스 수와 단 적재 패턴 그림, 높이·랩핑 기준을 정리한 표. 상품 한 개의 사양을 적은 상품 규격서(SAL-19)와 달리 상품별 적재 단수와 적재 패턴이 중심"
      - minor_code: "SAL-17"
        minor_name: "제품 라벨 시안"
        definition: "제품명, 식품유형, 내용량, 원재료명, 영양정보, 보관방법, 소비기한, 알레르기, 제조원과 바코드를 포장 라벨 모양으로 배치한 인쇄 전 시안과 디자인·품질·승인란. 표 형식의 상품 규격서(SAL-19)와 달리 포장 라벨 모양으로 배치하고 승인란이 있음"
      - minor_code: "SAL-18"
        minor_name: "경쟁사 제품 비교표"
        definition: "우리 제품과 경쟁사 제품을 열로 놓고 판매가·용량·100g당 가격·원료·유통 채널·행사·장단점(또는 별점)을 같은 항목으로 맞비교한 표"
      - minor_code: "SAL-19"
        minor_name: "상품 규격서"
        definition: "상품 하나의 상품명·코드·바코드(GTIN)·규격·제조원·원산지·보관·소비기한과 낱개·박스·파렛트 포장 단위별 크기·중량·입수를 기재한 규격 사양서. 여러 상품을 나열하는 상품 카탈로그(SAL-10)나 라벨 모양으로 배치한 제품 라벨 시안(SAL-17)과 달리 상품 하나의 사양을 표로 적음"
      - minor_code: "SAL-20"
        minor_name: "지역별 영업 담당 구역도"
        definition: "서울·경기·강원 등 지역을 타일 지도나 목록으로 나누어 담당자별 색으로 표시하고 담당 구역·거래처 수·매출 목표를 적은 구역도. 한 거래처의 찾아오는 길을 그린 거래처 위치 약도(CUS-12)와 달리 지역별 담당자 배치가 중심"

  - major: "고객/거래처"
    items:
      - minor_code: "CUS-01"
        minor_name: "비밀유지계약서"
        definition: "원사업자와 수급사업자 간 제공하는 기술자료의 명칭·범위, 제공받는 목적, 사용기간·반환(폐기)일 및 보유 임직원 명단이 포함된 계약서(NDA)"
      - minor_code: "CUS-02"
        minor_name: "가맹계약서"
        definition: "가맹본부와 가맹점사업자 간 영업표지(브랜드) 사용, 최초가맹금·계속가맹금(로열티), 영업지역 보호, 교육훈련 조건을 약정한 프랜차이즈 계약서"

  - major: "법무/총무"
    items:
      - minor_code: "LEG-01"
        minor_name: "상가건물 임대차계약서"
        definition: "큰 제목이 '상가건물 임대차 표준계약서'인 임대차 계약서. 오른쪽 위 머리글에 '상가건물 임대차 표준계약서 (2024. 5. 8 개정)'이 적혀 있음. 본문 서식은 LEG-02와 같음"
      - minor_code: "LEG-02"
        minor_name: "표준임대차계약서"
        definition: "큰 제목이 '표준임대차계약서'인 임대차 계약서. 오른쪽 위 머리글에 '표준임대차계약서'가 적혀 있음. 본문 서식은 LEG-01과 같음"

  - major: "기타"
    items:
      - minor_code: "ETC-00"
        minor_name: "분류불가 (신규 분류 제안)"
        definition: "분류 체계의 소분류에 해당하지 않는 사외 양식이나 미등록 문서로 신규 분류 제안(NEW-xx)이 필요한 문서"
