# config/employees.yaml
# 데모 로그인용 가상 사원 목록. 실제 인증이 아니다. 비밀번호는 시연용 가짜 값(평문)이며 보안 기능이 아니다 (RBAC는 범위 밖).
# 저장소에 올라가는 파일이므로 실제 비밀번호는 절대 쓰지 않는다.
# 부서가 다루는 문서 성격은 대분류(config/taxonomy.yaml의 major 이름)로 정한다. 소분류 목록은 분류 체계에서 읽는다.

departments:
  - name: "인사팀"
    majors: ["인사/채용"]
    summary: "채용 지원서, 근로계약, 급여·재직 증명 등 사람과 관련된 문서"
  - name: "재무회계팀"
    majors: ["재무/회계"]
    summary: "재무제표, 세금계산서, 세무 신고서처럼 돈의 흐름을 기록한 문서"
  - name: "경영기획팀"
    majors: ["경영/전략"]
    summary: "사업계획서, 재고조사표 등 회사의 계획과 현황을 정리한 문서"
  - name: "영업팀"
    majors: ["영업/제안"]
    summary: "제안서, 견적서, 발주서 등 판매와 수주 과정에서 오가는 문서"
  - name: "고객지원팀"
    majors: ["고객/거래처"]
    summary: "계약서, 거래처 관련 서류 등 외부 고객·거래처와 주고받는 문서"
  - name: "법무총무팀"
    majors: ["법무/총무"]
    summary: "법령 준수, 인증·허가, 사내 행정과 관련된 문서"

